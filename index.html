<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Книга Открытий</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    #cover-screen {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      background-color: #c9a63f;
      background-image:
        linear-gradient(180deg, rgba(255, 248, 220, 0.14), rgba(120, 90, 20, 0.12)),
        url("cover-puzzle.svg");
      background-size: auto, 140px 140px;
      background-repeat: no-repeat, repeat;
    }
    .cover-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15em;
      color: #5a4d63;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      text-align: center;
      text-shadow: 0 1px 0 rgba(255, 248, 220, 0.35), 0 2px 10px rgba(90, 70, 20, 0.18);
    }
    .cover-author {
      font-size: clamp(1.7rem, 5vw, 2.9rem);
      font-style: italic;
      font-weight: 500;
      letter-spacing: 0.02em;
      margin-bottom: 0.35em;
    }
    .cover-line {
      font-size: clamp(3.4rem, 12vw, 7rem);
      font-style: italic;
      font-weight: 500;
      letter-spacing: 0.01em;
      line-height: 1.12;
    }
  </style>
</head>
<body>
  <div id="cover-screen">
    <div class="cover-text">
      <span class="cover-author">Яков Фельдман</span>
      <span class="cover-line">Книга</span>
      <span class="cover-line">Открытий</span>
    </div>
  </div>
</body>
</html>
